services:
  postgres:
    image: postgres:16-alpine
    container_name: prms_postgres
    environment:
      POSTGRES_USER: prms_user
      POSTGRES_PASSWORD: prms_password
      POSTGRES_DB: prms_ai_db
    ports:
      - "5432:5432"
    volumes:
      - prms_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: prms_backend
    environment:
      DATABASE_URL: postgresql://prms_user:prms_password@postgres:5432/prms_ai_db
      JWT_SECRET_KEY: super-secret-prms-jwt-key-change-in-prod
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-PRMS-Agentic-AI}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: prms_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  prms_pgdata:
